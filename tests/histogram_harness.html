<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Harness pentru histograma etapei 5</title>
</head>
<body>
<!-- Pagină de test: încarcă scripturile reale ale interfeței și desenează etapa 5 pe etape sintetice
     (window.CASES, injectat de tests/test_interface.py). Rezultatul apare ca JSON în #out. -->
<pre id="out">în așteptare</pre>
<script src="__ROOT__/util/colors.js"></script>
<script src="__ROOT__/util/svg.js"></script>
<script src="__ROOT__/views/graph.js"></script>
<script src="__ROOT__/views/results.js"></script>
<script>
window.CASES = __CASES__;
(function () {
  var results = [];
  window.CASES.forEach(function (c) {
    var box = document.createElement('div');
    document.body.appendChild(box);
    var record = { name: c.name, error: null };
    try {
      NeuroQ.views.top.render(box, c.stage);
      var wrap = box.querySelector('.nq-hist');
      record.bars = Array.prototype.map.call(box.querySelectorAll('.nq-bar'), function (g) {
        return [g.getAttribute('data-bits'), Number(g.getAttribute('data-count'))];
      });
      record.total = Number(wrap.getAttribute('data-total'));
      record.hiddenStrings = Number(wrap.getAttribute('data-hidden-strings'));
      record.hiddenShots = Number(wrap.getAttribute('data-hidden-shots'));
      record.cards = Array.prototype.map.call(box.querySelectorAll('.nq-pairnums .v'), function (v) {
        return Number(v.textContent);
      });
      record.limits = NeuroQ.views.top.limits;
    } catch (error) {
      record.error = String((error && error.stack) || error);
    }
    results.push(record);
  });
  document.getElementById('out').textContent = JSON.stringify(results);
})();
</script>
</body>
</html>
